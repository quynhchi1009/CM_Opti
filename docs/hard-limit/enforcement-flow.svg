middle" dominant-baseline="central">Usage reached limit?</text><rect x="130" y="400" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="210.0" y="419.0" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Allow request</text><text x="210.0" y="438.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Opal action runs</text><rect x="130" y="490" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="210.0" y="509.0" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Record credits</text><text x="210.0" y="528.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Per-action cost</text><rect x="130" y="580" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="210.0" y="599.0" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Usage meter</text><text x="210.0" y="618.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">2h now, near real-time</text><rect x="390" y="400" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="490.0" y="419.0" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle" dominant-baseline="central">Block all Opal actions</text><text x="490.0" y="438.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">Chat, agents, workflows</text><rect x="390" y="490" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="490.0" y="509.0" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle" dominant-baseline="central">Limit-reached UI</text><text x="490.0" y="528.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">Banner, disabled buttons</text><rect x="390" y="580" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="490.0" y="599.0" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle" dominant-baseline="central">Notify admins</text><text x="490.0" y="618.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">100% alert, email + in-app</text><rect x="130" y="676" width="460" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="360.0" y="700.0" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">Usage &amp; billing UI: tiles, limit toggle, % alerts</text><line x1="130" y1="74" x2="260" y2="114" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="340" y1="74" x2="340" y2="114" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="550" y1="74" x2="420" y2="114" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="340" y1="172" x2="340" y2="208" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="430" y1="232" x2="468" y2="232" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="340" y1="254" x2="340" y2="298" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="310" y1="344" x2="210" y2="398" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="370" y1="344" x2="490" y2="398" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="210" y1="456" x2="210" y2="488" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="210" y1="546" x2="210" y2="578" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="490" y1="456" x2="490" y2="488" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="490" y1="546" x2="490" y2="578" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="210" y1="636" x2="210" y2="674" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="490" y1="636" x2="490" y2="674" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><text x="449" y="222" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">off</text><text x="352" y="278" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">on</text><text x="246" y="366" font-size="12" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">under</text><text x="436" y="366" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">reached</text><path d="M130 608 L70 608 L70 322 L248 322" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="78" y="468" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">usage feed</text></g></svg>