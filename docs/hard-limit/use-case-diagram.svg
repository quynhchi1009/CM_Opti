ill="#5F5E5A" text-anchor="start" dominant-baseline="central">Top 3 tiles: used, limit, left</text><rect x="200" y="218" width="220" height="36" rx="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="310.0" y="236.0" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">Set % alert thresholds</text><text x="436" y="236" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Billing: notification settings</text><rect x="200" y="264" width="220" height="36" rx="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="310.0" y="282.0" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">Enable limit while in overage</text><text x="436" y="282" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Validation / overage warning</text><rect x="200" y="310" width="220" height="36" rx="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="310.0" y="328.0" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">Monitor near-real-time usage</text><text x="436" y="328" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Refresh time, stale-data note</text><rect x="200" y="356" width="220" height="36" rx="18" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="310.0" y="374.0" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle" dominant-baseline="central">Run chat / purple button</text><text x="436" y="374" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Disabled button + tooltip</text><rect x="200" y="402" width="220" height="36" rx="18" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="310.0" y="420.0" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle" dominant-baseline="central">See limit-reached state</text><text x="436" y="420" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Blocking banner or modal</text><rect x="200" y="448" width="220" height="36" rx="18" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="310.0" y="466.0" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle" dominant-baseline="central">Receive % usage alerts</text><text x="436" y="466" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">In-app banner + email</text><rect x="200" y="494" width="220" height="36" rx="18" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="310.0" y="512.0" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle" dominant-baseline="central">Trigger agent near limit</text><text x="436" y="512" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Pre-check: 48 + 5 over 50?</text><rect x="200" y="540" width="220" height="36" rx="18" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="310.0" y="558.0" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle" dominant-baseline="central">Scheduled workflow halted</text><text x="436" y="558" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Failed run + admin alert</text><rect x="200" y="586" width="220" height="36" rx="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/><text x="310.0" y="604.0" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Set department limit</text><text x="436" y="604" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Future: per-dept limits</text><rect x="200" y="632" width="220" height="36" rx="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/><text x="310.0" y="650.0" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">View department usage</text><text x="436" y="650" font-size="12" fill="#5F5E5A" te